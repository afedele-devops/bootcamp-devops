services:
  redis:
    image: redis:7-alpine
    container_name: pokemon-redis
    # command: ["redis-server", "--save", "", "--appendonly", "no"]
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 5
    #   start_period: 5s
    networks:
      - pockemon-net

  backend:
    container_name: pokemon-backend
    build:
      context: ./backend
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change}
      PORT: ${PORT:-3000}
      NODE_EV: ${NODE_EV:-development}
    depends_on:
      - redis
    ports:
      - "${PORT:-3000}:3000"
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 15s
    networks:
      - pockemon-net

  frontend:
    container_name: pokemon-frontend
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 10s
    networks:
      - pockemon-net

networks:
  pockemon-net:
    driver: bridge

# Optional persistence for Redis:
# volumes:
#   redis-data:
# redis service extra:
#   volumes:
#     - redis-data:/data
